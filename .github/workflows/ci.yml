name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet (Linux and Windows builds)
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
      - run: make test

  # Runs the Windows-specific tests natively and smoke-tests the real AyrPlay.exe.
  # The rest of the suite exercises Linux capture/daemon plumbing and runs above.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash # fail on the first failing command (pwsh only checks the last)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test AyrPlay packages
        run: go test ./cmd/ayrplay ./internal/tray ./internal/gstreamer ./internal/sender
      - name: Test Windows-specific sender code
        run: |
          go test ./internal/daemon -run FileLock
          go test ./internal/airplay -run 'Wireless|WindowsAudioLoopback|WindowsCapturePipeline|AudioOnly|HomePod|SetupAudio|RealtimeAudio|CompatibilityForSession|IsAudioOnlyModel|SendFrame|HEVCStreamResync|VideoSendBuffer|CredentialRequest|StatusRoundTrip'
      - name: Build and smoke-test AyrPlay.exe
        run: |
          (cd cmd/ayrplay && go generate .)
          go build -o AyrPlay.exe ./cmd/ayrplay
          ./AyrPlay.exe version
          ./AyrPlay.exe help
          ./AyrPlay.exe send -h
          # No GStreamer on the runner, so doctor must report "not ready" (exit 1);
          # any other code means the command itself broke.
          code=0
          ./AyrPlay.exe doctor -json || code=$?
          [ "$code" -eq 1 ] || { echo "doctor exited $code, want 1 without GStreamer"; exit 1; }
          mkdir -p dist && mv AyrPlay.exe dist/ && (cd dist && sha256sum AyrPlay.exe > SHA256SUMS.txt)
      # Users run the installer in Windows PowerShell 5.1 (`irm ... | iex`), so
      # exercise it there: install, shortcut, tamper rejection, uninstall.
      - name: Test install.ps1 (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          $dist = Join-Path $PWD 'dist'
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\AyrPlay\AyrPlay.exe'
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'AyrPlay.lnk'

          $envKey = Get-Item 'HKCU:\Environment'
          $pathBefore = $envKey.GetValue('Path', '', 'DoNotExpandEnvironmentNames')

          & .\scripts\install.ps1 -AssetDir $dist -NoGStreamer -NoLaunch
          if (-not (Test-Path $installed)) { throw "AyrPlay.exe was not installed" }
          if (-not (Test-Path $shortcut)) { throw "Start menu shortcut was not created" }
          $installDir = Split-Path $installed
          $envKey = Get-Item 'HKCU:\Environment'
          $pathAfter = $envKey.GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          if (($pathAfter -split ';') -notcontains $installDir) { throw "user PATH lacks $installDir" }
          if ($envKey.GetValueKind('Path') -ne 'ExpandString') { throw "user PATH lost its REG_EXPAND_SZ type" }
          # `version` prints two lines; join them so -notmatch tests a string,
          # not an array (an array returns its non-matching lines, which is truthy).
          $version = (& $installed version) -join "`n"
          if ($version -notmatch '^ayrplay ') { throw "installed exe printed '$version'" }

          $bad = Join-Path $PWD 'bad'
          New-Item -ItemType Directory -Force $bad | Out-Null
          Copy-Item (Join-Path $dist 'AyrPlay.exe') $bad
          Set-Content (Join-Path $bad 'SHA256SUMS.txt') (('0' * 64) + '  AyrPlay.exe')
          $rejected = $false
          try { & .\scripts\install.ps1 -AssetDir $bad -NoGStreamer -NoLaunch -NoPath -NoShortcut }
          catch { if ($_.Exception.Message -notmatch 'Checksum mismatch') { throw }; $rejected = $true }
          if (-not $rejected) { throw "a tampered AyrPlay.exe was accepted" }
          if (-not (Test-Path $installed)) { throw "a rejected update removed the working install" }

          & .\scripts\install.ps1 -Uninstall
          if ((Test-Path $installed) -or (Test-Path $shortcut)) { throw "uninstall left files behind" }
          $pathFinal = (Get-Item 'HKCU:\Environment').GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          $norm = { param($p) (@($p -split ';') | Where-Object { $_ }) -join ';' }
          if ((& $norm $pathFinal) -ne (& $norm $pathBefore)) { throw "uninstall did not restore the user PATH: '$pathFinal' vs '$pathBefore'" }
          exit 0

  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            suffix: ""
          - runner: ubuntu-24.04-arm
            suffix: "-arm64"
    runs-on: ${{ matrix.runner }}
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build doubletake
        run: make doubletake-release

      - name: Build doubletake-ctl
        run: make doubletake-ctl-release

      - name: Build doubletake-test-receiver
        run: make doubletake-test-receiver-release

      - name: Bundle manpages
        if: matrix.suffix == ''
        run: make manpages-release

      # AyrPlay.exe is pure Go, so both Windows architectures cross-compile here.
      # Release binaries are only ever built by CI from the tagged source.
      - name: Build AyrPlay.exe (Windows x64 and arm64)
        if: matrix.suffix == ''
        run: |
          make windows VERSION="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}"
          mv bin/AyrPlay.exe bin/AyrPlay-arm64.exe .

      - name: Add architecture suffix
        if: matrix.suffix != ''
        run: |
          mv doubletake "doubletake${{ matrix.suffix }}"
          mv doubletake-ctl "doubletake-ctl${{ matrix.suffix }}"
          mv doubletake-test-receiver "doubletake-test-receiver${{ matrix.suffix }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets${{ matrix.suffix }}
          path: |
            doubletake${{ matrix.suffix }}
            doubletake-ctl${{ matrix.suffix }}
            doubletake-test-receiver${{ matrix.suffix }}
            doubletake-manpages.tar.gz
            AyrPlay.exe
            AyrPlay-arm64.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build, windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets*
          merge-multiple: true

      - name: Extract release notes from tag
        id: notes
        run: |
          # Re-fetch the tag to ensure the annotated tag object is present
          git fetch origin tag "${GITHUB_REF_NAME}" --force --no-tags
          NOTES=$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")
          if [ -z "$NOTES" ]; then
            NOTES=$(git log -1 --format='%B' "${GITHUB_REF_NAME}")
          fi
          {
            echo 'RELEASE_NOTES<<EOF'
            echo "$NOTES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Checksums
        run: |
          sha256sum doubletake doubletake-ctl doubletake-test-receiver \
            doubletake-arm64 doubletake-ctl-arm64 doubletake-test-receiver-arm64 \
            doubletake-manpages.tar.gz AyrPlay.exe AyrPlay-arm64.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.RELEASE_NOTES }}
          files: |
            doubletake
            doubletake-ctl
            doubletake-test-receiver
            doubletake-arm64
            doubletake-ctl-arm64
            doubletake-test-receiver-arm64
            doubletake-manpages.tar.gz
            AyrPlay.exe
            AyrPlay-arm64.exe
            SHA256SUMS.txt

  # Installs the just-published release the way users do (Windows PowerShell
  # 5.1, real GitHub download + checksum), so a broken release is caught at once.
  release-smoke:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - name: Install the release with install.ps1
        shell: powershell
        run: |
          & .\scripts\install.ps1 -Version $env:GITHUB_REF_NAME -NoGStreamer -NoLaunch -NoPath -NoShortcut
          $version = (& (Join-Path $env:LOCALAPPDATA 'Programs\AyrPlay\AyrPlay.exe') version) -join "`n"
          if ($version -notmatch [regex]::Escape($env:GITHUB_REF_NAME)) { throw "installed exe reports '$version', want $env:GITHUB_REF_NAME" }
          exit 0
